name: Update README with latest blog posts

on:
  schedule:
    # Runs every day at 12:00 UTC
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  update-readme-with-blog:
    name: Update this repo's README with latest blog posts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - uses: gautamkrishnar/blog-post-workflow@master
        with:
          comment_tag_name: "BLOG-POST-LIST"
          feed_list: "https://medium.com/feed/@yourusername,https://dev.to/feed/yourusername"
          max_post_count: 5
          template: "- $randomEmoji(📊,🎯,📈,🏛️,💰,🔍,📚) $title"
          date_format: "mmm dd, yyyy"
          
      - name: Update Repository Info
        run: |
          echo "Last updated: $(date)" >> LAST_UPDATED
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git diff --staged --quiet || git commit -m "Auto-update README and stats"
          git push 